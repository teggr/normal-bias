server.address=127.0.0.1
server.port=8080
server.tomcat.connection-timeout=30s
server.error.include-message=never
spring.datasource.url=jdbc:h2:file:${normalbias.data-dir:./data}/catalogue;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
spring.servlet.multipart.enabled=false
normalbias.data-dir=./data
normalbias.max-upload-bytes=268435456

# Metadata-only cover lookup runs independently of listening clients.
normalbias.artwork.background-enabled=true
normalbias.artwork.initial-delay-ms=5000
normalbias.artwork.scan-delay-ms=30000
